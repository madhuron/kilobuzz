# Выпуск версии: git tag vX.Y.Z && git push --tags
# Собирает установщики для macOS и Windows и публикует их в GitHub Releases —
# установленные копии Kilobuzz подхватывают обновление автоматически (src/main/updater.js).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Релиз создаётся один раз заранее — иначе сборки Mac и Windows, закончив одновременно,
  # создают каждая свой релиз с одной и той же версией.
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Создать релиз
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "Kilobuzz ${TAG#v}" --notes "Сборка идёт…"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}

  mac:
    needs: release
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Захват системного звука (Core Audio)
        run: npm run build:native
      - name: Сборка и публикация
        run: npx electron-builder --mac --universal --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
      - name: Модуль Windows (APO)
        shell: msys2 {0}
        run: CXX=g++ bash native/win/build.sh
      - run: npm ci
      - name: Сборка и публикация
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
